# The manager controls the displayed hierarchy here.
# A leaf may be:
# - "Visible label": "an explicit path to a file, from the repository root"
# - Visible text with no link
#
# Local paths (pages and static downloads) are explicit and relative to the
# repository root, e.g. "modules/math/day-1/preliminaries/day-1-preliminaries.html".
# scripts/build_site.py resolves that exact path and fails the build if it
# does not exist. There is no filename search and no fallback.
#
# A heading ("Day 1:", etc.) may carry a path prefix after its colon, e.g.
# "Day 1: modules/math/day-1". When present, every leaf nested under that
# heading must resolve to a path under that folder, or the build fails. The
# label before the colon is still exactly what a visitor sees; the prefix is
# never displayed. Headings with no natural folder of their own (for example
# "Morning Session") simply omit the prefix and stay display-only.

